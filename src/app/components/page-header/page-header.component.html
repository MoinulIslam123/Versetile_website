<section
  class="relative isolate overflow-hidden bg-gradient-to-br from-brand-navy via-[#16307a] to-brand-blue pb-24 pt-40 text-white"
>
  <div
    class="bg-grid-dark absolute inset-0 -z-10 [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_75%)]"
  ></div>
  <div
    class="absolute -right-24 -top-24 -z-10 h-96 w-96 animate-float-slow rounded-full bg-brand-orange/25 blur-3xl"
  ></div>
  <div
    class="absolute -bottom-32 -left-24 -z-10 h-96 w-96 animate-float rounded-full bg-sky-400/20 blur-3xl"
  ></div>

  <div class="mx-auto max-w-4xl px-4 text-center sm:px-6">
    @if (eyebrow()) {
      <span
        class="inline-block rounded-full border border-white/25 bg-white/10 px-5 py-1.5 text-xs font-semibold uppercase tracking-[0.3em] backdrop-blur"
        >{{ eyebrow() }}</span
      >
    }
    <h1 class="mt-5 font-display text-4xl font-bold leading-tight sm:text-6xl">
      {{ title() }}
    </h1>
    <div class="mx-auto mt-6 flex items-center justify-center gap-2">
      <span class="h-1 w-10 rounded-full bg-sky-300"></span>
      <span class="h-2 w-2 rotate-45 bg-brand-orange"></span>
      <span class="h-1 w-10 rounded-full bg-brand-orange"></span>
    </div>
    @if (subtitle()) {
      <p class="mx-auto mt-6 max-w-2xl text-lg text-slate-200">
        {{ subtitle() }}
      </p>
    }
  </div>

  <!-- curved bottom edge -->
  <svg
    class="absolute inset-x-0 bottom-0 -mb-px w-full text-white"
    viewBox="0 0 1440 80"
    preserveAspectRatio="none"
    fill="currentColor"
  >
    <path
      d="M0,80 L0,40 C240,90 480,0 720,30 C960,60 1200,90 1440,35 L1440,80 Z"
    />
  </svg>
</section>
