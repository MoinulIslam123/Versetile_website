<section class="relative isolate overflow-hidden bg-gradient-to-br from-brand-navy via-[#16307a] to-brand-blue py-24 text-white">
  <div class="bg-grid-dark absolute inset-0 -z-10"></div>
  <div class="absolute -right-20 top-0 -z-10 h-80 w-80 rounded-full bg-brand-orange/20 blur-3xl"></div>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <app-section-heading [light]="true" eyebrow="Our Work Process" title="Simple & Convenient Ordering Process" />
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (s of steps; track s.title; let i = $index) {
        <div appReveal class="group relative rounded-3xl border border-white/15 bg-white/10 p-8 backdrop-blur transition duration-500 hover:-translate-y-2 hover:bg-white/15">
          <span class="font-display text-6xl font-bold text-gradient">{{ '0' + (i + 1) }}</span>
          <h3 class="mt-4 font-display text-xl font-bold">{{ s.title }}</h3>
          <p class="mt-2 text-slate-300">{{ s.text }}</p>
        </div>
      }
    </div>
  </div>
</section>
