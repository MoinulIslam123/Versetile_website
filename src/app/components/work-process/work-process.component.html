<app-page-header
  eyebrow="Our Work Process"
  title="How We Work"
  subtitle="A simple, transparent ordering process"
/>

<section class="bg-dots bg-slate-50 pb-24 pt-10">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <!-- timeline -->
    <ol
      class="relative mx-auto max-w-3xl border-l-2 border-dashed border-brand-blue/30 pl-10 sm:pl-14"
    >
      @for (s of steps; track s.title; let i = $index) {
        <li appReveal class="relative pb-10 last:pb-0">
          <span
            class="absolute -left-16 grid h-12 w-12 place-items-center rounded-full bg-gradient-to-br from-brand-blue to-brand-navy font-display text-lg font-bold text-white shadow-lg ring-4 ring-slate-50 sm:-left-20"
            >{{ i + 1 }}</span
          >
          <div class="card-p group">
            <span
              class="absolute right-6 top-3 font-display text-6xl font-bold text-slate-100 transition group-hover:text-brand-orange/20"
              >{{ "0" + (i + 1) }}</span
            >
            <h3 class="font-display text-xl font-bold text-brand-navy">
              {{ s.title }}
            </h3>
            <p class="mt-2 leading-relaxed text-slate-500">{{ s.text }}</p>
          </div>
        </li>
      }
    </ol>

    <!-- call to action -->
    <div
      appReveal
      class="relative mx-auto mt-16 max-w-3xl overflow-hidden rounded-[2rem] bg-gradient-to-br from-brand-navy to-brand-blue p-8 text-center text-white shadow-2xl shadow-brand-navy/30 sm:p-10"
    >
      <div
        class="absolute -top-12 left-1/2 h-40 w-40 -translate-x-1/2 rounded-full bg-brand-orange/30 blur-3xl"
      ></div>
      <h3 class="relative font-display text-3xl font-bold">
        Ready to get started?
      </h3>
      <p class="relative mt-3 text-slate-200">
        Share your requirements and we'll send you a quotation.
      </p>
      <a routerLink="/contact" class="btn-primary relative mt-6"
        >Request a Quotation <app-icon name="arrow-right" class="h-5 w-5"
      /></a>
    </div>
  </div>
</section>
