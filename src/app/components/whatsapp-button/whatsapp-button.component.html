<a [href]="link" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"
   class="group fixed bottom-6 right-6 z-50 flex items-center gap-3">
  <span class="pointer-events-none hidden translate-x-3 rounded-full bg-white px-4 py-2 text-sm font-semibold text-brand-navy opacity-0 shadow-xl transition duration-300 group-hover:translate-x-0 group-hover:opacity-100 sm:block">Chat with us</span>
  <span class="relative grid h-14 w-14 place-items-center rounded-full bg-gradient-to-br from-green-400 to-green-600 text-white shadow-xl shadow-green-600/40 transition group-hover:scale-110">
    <span class="absolute inset-0 animate-ping rounded-full bg-green-400/50"></span>
    <app-icon name="message-circle" class="relative h-7 w-7" />
  </span>
</a>
