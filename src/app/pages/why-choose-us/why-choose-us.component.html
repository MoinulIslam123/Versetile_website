<app-page-header eyebrow="Why Choose Us" title="Why Versatile Support & Supply?"
  subtitle="Choosing the right supplier and service partner is important. We focus on a convenient and professional customer experience." />

<section class="bg-dots bg-slate-50 pb-24 pt-10">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (w of reasons; track w.title; let i = $index) {
        <div appReveal class="card-p group" [class]="i === 0 ? 'lg:col-span-2' : ''">
          <span class="absolute right-6 top-4 font-display text-6xl font-bold text-slate-100 transition group-hover:text-brand-orange/20">{{ '0' + (i + 1) }}</span>
          <div class="icon-tile"><app-icon [name]="w.icon" class="h-6 w-6" /></div>
          <h3 class="mt-6 font-display text-xl font-bold text-brand-navy">{{ w.title }}</h3>
          <p class="mt-2 text-slate-500">{{ w.text }}</p>
        </div>
      }
    </div>

    <div appReveal class="relative mt-16 overflow-hidden rounded-[2rem] bg-gradient-to-r from-brand-navy to-brand-blue p-10 text-center text-white shadow-2xl">
      <div class="absolute -top-16 left-1/2 h-48 w-48 -translate-x-1/2 rounded-full bg-brand-orange/30 blur-3xl"></div>
      <h3 class="relative font-display text-3xl font-bold">Let's Build Something Great Together!</h3>
      <p class="relative mx-auto mt-3 max-w-xl text-slate-200">Contact us today to discuss your product requirements, interior projects, and business inquiries.</p>
      <a routerLink="/contact" class="btn-primary relative mt-7">Contact Us <app-icon name="arrow-right" class="h-5 w-5" /></a>
    </div>
  </div>
</section>
