<app-page-header eyebrow="Services" title="Our Professional Services"
  subtitle="Product sourcing, customized solutions, and business services designed to meet different customer requirements." />

<section class="bg-white pb-24 pt-10">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (s of services; track s.title; let i = $index) {
        <div appReveal class="card-p group">
          <span class="absolute right-6 top-4 font-display text-6xl font-bold text-slate-100 transition group-hover:text-brand-orange/20">{{ i < 9 ? '0' + (i + 1) : i + 1 }}</span>
          <div class="icon-tile"><app-icon [name]="s.icon" class="h-6 w-6" /></div>
          <h3 class="mt-6 font-display text-xl font-bold text-brand-navy">{{ s.title }}</h3>
          <p class="mt-3 text-slate-500">{{ s.text }}</p>
        </div>
      }
    </div>
  </div>
</section>

<app-work-process />
