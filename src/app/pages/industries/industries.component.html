<app-page-header eyebrow="Industries We Serve" title="Serving Different Business Sectors"
  subtitle="Every industry has different requirements — our goal is to provide suitable products and solutions for each customer." />

<section class="bg-dots bg-slate-50 pb-24 pt-10">
  <div class="mx-auto grid max-w-7xl grid-cols-2 gap-5 px-4 sm:px-6 md:grid-cols-3 lg:grid-cols-4 lg:px-8">
    @for (i of industries; track i.title) {
      <div appReveal class="group relative overflow-hidden rounded-3xl bg-white p-7 text-center ring-1 ring-slate-200/70 shadow-[0_10px_40px_-18px_rgba(15,31,74,.25)] transition duration-500 hover:-translate-y-2 hover:shadow-2xl">
        <div class="absolute inset-0 -z-0 translate-y-full bg-gradient-to-br from-brand-blue to-brand-navy transition duration-500 group-hover:translate-y-0"></div>
        <div class="relative">
          <div class="mx-auto grid h-16 w-16 place-items-center rounded-2xl bg-brand-blue/10 text-brand-blue transition duration-500 group-hover:bg-white/15 group-hover:text-white"><app-icon [name]="i.icon" class="h-8 w-8" /></div>
          <p class="mt-5 font-display text-base font-bold leading-snug text-brand-navy transition group-hover:text-white">{{ i.title }}</p>
        </div>
      </div>
    }
  </div>
</section>
