<h1 class="font-display text-3xl font-bold text-brand-navy">Change Password</h1>
<form (ngSubmit)="save()" class="mt-6 max-w-md space-y-5 rounded-3xl bg-white p-8 shadow-md">
  <div><label class="mb-1.5 block text-sm font-semibold text-brand-navy">Current password</label><input class="input" type="password" name="current" [(ngModel)]="current" required /></div>
  <div><label class="mb-1.5 block text-sm font-semibold text-brand-navy">New password (min. 8 characters)</label><input class="input" type="password" name="next" [(ngModel)]="next" required minlength="8" /></div>
  <div><label class="mb-1.5 block text-sm font-semibold text-brand-navy">Confirm new password</label><input class="input" type="password" name="confirm" [(ngModel)]="confirm" required /></div>
  @if (error) { <p class="rounded-xl bg-red-50 p-3 text-sm text-red-600">{{ error }}</p> }
  @if (message) { <p class="rounded-xl bg-green-50 p-3 text-sm text-green-700">{{ message }}</p> }
  <button type="submit" class="btn-primary" [disabled]="!current || next.length < 8">Save password</button>
</form>
