<div class="min-h-screen bg-slate-100 md:flex">
  <aside class="bg-gradient-to-b from-brand-navy to-[#14307a] text-white md:sticky md:top-0 md:h-screen md:w-64 md:shrink-0">
    <div class="flex items-center gap-3 border-b border-white/10 px-6 py-5">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-brand-orange"><app-icon name="layers" class="h-5 w-5" /></span>
      <span class="leading-tight"><span class="block font-display text-lg font-bold">Admin Panel</span><span class="text-xs text-white/60">Versatile Support & Supply</span></span>
    </div>

    <nav class="flex gap-2 overflow-x-auto p-3 md:flex-col md:overflow-visible">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="!bg-white/15 !text-white"
           class="flex shrink-0 items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium text-white/70 transition hover:bg-white/10 hover:text-white">
          <app-icon [name]="l.icon" class="h-5 w-5" />{{ l.label }}
        </a>
      }
    </nav>

    <div class="hidden space-y-2 border-t border-white/10 p-3 md:absolute md:inset-x-0 md:bottom-0 md:block">
      <a routerLink="/" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/70 transition hover:bg-white/10 hover:text-white"><app-icon name="arrow-up-right" class="h-5 w-5" />View website</a>
      <button type="button" (click)="auth.logout()" class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-sm text-white/70 transition hover:bg-red-500/20 hover:text-white"><app-icon name="x" class="h-5 w-5" />Log out</button>
    </div>
  </aside>

  <main class="min-w-0 flex-1 p-4 sm:p-8">
    <router-outlet />
    <div class="mt-8 flex gap-3 md:hidden">
      <a routerLink="/" class="btn-primary !px-5 !py-2 text-sm">View website</a>
      <button type="button" (click)="auth.logout()" class="rounded-full border border-slate-300 px-5 py-2 text-sm font-semibold text-slate-600">Log out</button>
    </div>
  </main>
</div>
